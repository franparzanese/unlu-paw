version: "3.8"

services:
  web:
    image: php:8.4-apache
    working_dir: /app
    command: php -S 0.0.0.0:80 -t public/
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./:/app
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-admin}
      DB_DATABASE: ${DB_DATABASE:-unlupaw}
    depends_on:
      - db
  db:
    image: mysql:8.4
    restart: always
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_DATABASE: ${DB_DATABASE:-unlupaw}

volumes:
  db_data:
